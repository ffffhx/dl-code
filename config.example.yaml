# Example config.yaml
# You can use this example to create your own config.yaml file.
# Just copy this file and rename it to config.yaml and fill in the values.
#
# You can also use environment variables to fill in the values.
# For example, if you want to use the OPENAI_API_KEY environment variable, you can use $OPENAI_API_KEY in the config.yaml file.

models:
  chat_model:
    model: 'gpt-5-2025-08-07'
    api_base: 'https://api.openai.com/v1'
    api_key: $OPENAI_API_KEY
    temperature: 0
    max_tokens: 8192 # Maximum model output, separate from the context window below.
    extra_body:
      reasoning_effort: 'minimal'
  # chat_model:
  #   type: doubao
  #   model: 'doubao-seed-1-6-250615'
  #   api_base: 'https://ark.cn-beijing.volces.com/api/v3'
  #   api_key: $ARK_API_KEY
  #   temperature: 0
  #   max_tokens: 8192
  #   extra_body:
  #     thinking:
  #       type: auto

context:
  max_tokens: 100000 # Total window; set to a value supported by your model/provider.
  # reserve_output_tokens defaults to models.chat_model.max_tokens (8192 if absent).
  safety_margin_tokens: 2048
  compression_threshold: 0.8 # Fraction of available input budget.
  target_ratio: 0.56 # Aim below the trigger to leave space for subsequent work.
  recent_tokens: 12000 # Retain recent whole tool exchanges within this soft budget.
  summary_tokens: 2000 # Maximum stored task handoff size.
  tool_output_tokens: 4000 # Larger text results become previews + artifact references.

tools:
  # MCP (Model Context Protocol) servers configuration
  # You can add multiple MCP servers here to extend the agent's capabilities
  mcp_servers:
    # Example: Chrome DevTools MCP server (stdio transport)
    # Provides browser automation, debugging, and performance analysis capabilities
    # chrome-devtools:
    #   transport: 'stdio'
    #   command: 'npx'
    #   args: ['-y', 'chrome-devtools-mcp@latest']

    # Example: Context7 MCP server (HTTP transport)
    # context7:
    #   transport: 'streamable_http'
    #   url: 'https://mcp.context7.com/mcp'

    # Example: Local MCP server (stdio transport)
    # my_local_server:
    #   transport: 'stdio'
    #   command: 'node'
    #   args: ['path/to/your/mcp-server.js']
    #   env:
    #     API_KEY: $YOUR_API_KEY
